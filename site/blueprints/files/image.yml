# Path: /site/blueprints/files/image.yml
# Filename: image.yml | Version: v7.8.0
# Agent: Architect-K
# Status: Production
# Logic: Starterkit ported image blueprint for metadata

title: Image
blueprint: file
accept:
  mime: image/jpeg, image/png, image/webp, image/svg+xml
  maxsize: 5242880
fields:
  alt:
    label: Alt Text
    type: text
    help: Important for accessibility and SEO.
  caption:
    label: Caption
    type: textarea
    buttons: false
