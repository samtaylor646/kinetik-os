name: Stat Card
icon: chart
preview: fields

fields:
  stat:
    label: Statistic (e.g. 99.9%)
    type: text
    width: 1/2
  label:
    label: Label
    type: text
    width: 1/2
  text:
    label: Additional Context
    type: text
  theme:
    label: Theme
    type: select
    placeholder: Default / Inherit
    options: query
    query:
      fetch: kirby.page("theme").color_profiles.toStructure
      text: "{{ item.profile_name }}"
      value: "{{ item.profile_id }}"
