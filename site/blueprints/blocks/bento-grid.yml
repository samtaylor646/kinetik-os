name: Bento Grid
icon: grid-cell
blueprint: block

fields:
  layout_type:
    label: Grid Layout
    type: select
    options:
      2-col: 2 Columns
      3-col: 3 Columns
      asymmetric: Asymmetric Grid
    default: 3-col
    
  theme:
    label: Block Theme
    type: select
    options:
      light: Light (Canvas)
      oceanic: Oceanic Prime
      dark: Dark (Ink)
      accent: Oceanic Accent
      slate: Slate Teal
      liberty: Liberty Blue
      heritage: Heritage Red
      gold: Warm Gold
      frost: Frost Mint
    default: light
    
  airy_spacing:
    label: Airy Spacing
    type: select
    options:
      sm: Small (sm)
      md: Medium (md)
      lg: Large (lg)
      xl: Extra Large (xl)
    default: md

  items:
    label: Grid Cells
    type: blocks
    fieldsets:
      - bento-feature
      - bento-media
      - bento-stat
      - bento-standard
