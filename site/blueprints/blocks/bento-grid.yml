name: Bento Grid
icon: grid
blueprint: block

fields:
  layout_type:
    label: Grid Layout Preset
    type: select
    options:
      hero_split: Hero Split
      quadrant: Quadrant
      feature_showcase: Feature Showcase
    default: feature_showcase
    help: Select a pre-defined mathematical layout preset.

  theme:
    label: Block Theme
    type: select
    options:
      light: Light (Canvas)
      oceanic: Oceanic Prime
      dark: Dark (Ink)
      accent: Oceanic Accent
      slate: Slate Teal
      liberty: Liberty Blue
      heritage: Heritage Red
      gold: Warm Gold
      frost: Frost Mint
    default: light
    
  items:
    label: Grid Cells
    type: blocks
    fieldsets:
      - bento-feature
      - bento-media
      - bento-stat
      - bento-standard
