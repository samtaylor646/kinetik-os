name: Bento Grid
icon: grid
blueprint: block

fields:
  layout_type:
    label: Grid Layout Preset
    type: select
    options:
      hero_split: Hero Split
      quadrant: Quadrant
      feature_showcase: Feature Showcase
    default: feature_showcase
    help: Select a pre-defined mathematical layout preset.

  theme:
    label: Block Theme
    type: select
    placeholder: Default / Inherit
    options: query
    query:
      fetch: kirby.page("theme").color_profiles.toStructure
      text: "{{ item.profile_name }}"
      value: "{{ item.profile_id }}"
  items:
    label: Grid Cells
    type: blocks
    fieldsets:
      - bento-feature
      - bento-media
      - bento-stat
      - bento-standard
