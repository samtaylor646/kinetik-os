# yaml-language-server: $schema=https://raw.githubusercontent.com/bnomei/kirby-schema/main/kirby5-blueprints.schema.json
name: Accordion Group
icon: list-bullet
blueprint: block
preview: fields

fields:
  allow_multiple:
    label: Allow Multiple Open
    type: toggle
    text:
      - "No (Close others when opening)"
      - "Yes (Keep others open)"
    default: false
    
  theme:
    label: Block Theme
    type: select
    placeholder: Default / Inherit
    options: query
    query:
      fetch: kirby.page("theme").color_profiles.toStructure
      text: "{{ item.profile_name }}"
      value: "{{ item.profile_id }}"
  airy_spacing:
    label: Airy Spacing
    type: select
    options:
      sm: Small (sm)
      md: Medium (md)
      lg: Large (lg)
      xl: Extra Large (xl)
    default: md

  items:
    label: Accordion Items
    type: structure
    fields:
      title:
        label: Title
        type: text
      content:
        label: Content
        type: blocks
