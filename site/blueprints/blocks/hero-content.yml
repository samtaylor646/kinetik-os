# yaml-language-server: $schema=https://raw.githubusercontent.com/bnomei/kirby-schema/main/kirby5-blueprints.schema.json
name: Hero Content
icon: star
blueprint: block
preview: fields

fields:
  eyebrow:
    label: Eyebrow
    type: text
    help: Small text above the heading

  heading:
    label: Heading (H1)
    type: text
    help: The primary hero statement

  subheading:
    label: Subheading
    type: textarea
    buttons: false
    help: Supporting text below the heading

  appearance_line:
    type: line

  alignment:
    label: Content Alignment
    type: select
    placeholder: Default
    options:
      left: Left Aligned
      center: Center Aligned
      right: Right Aligned
    width: 1/4

  boxed_layout:
    label: Boxed Layout
    type: toggle
    default: true
    text: 
      - "Off"
      - "On"
    help: Disabling removes the box and forces the text to inherit colors from the parent Row's theme.
    width: 1/4

  enable_shadow:
    label: Box Shadow
    type: toggle
    default: false
    text:
      - "Off"
      - "On"
    help: Adds a box shadow to the box.
    width: 1/4

  theme:
    label: Color Profile (Boxed)
    type: select
    placeholder: Inherit
    options: query
    query:
      fetch: kirby.page("theme").color_profiles.toStructure
      text: "{{ item.profile_name }}"
      value: "{{ item.profile_id }}"
    help: Applies only when Boxed Layout is 'On'. Otherwise, colors are inherited from the parent Row.
    width: 1/4

  bg_opacity:
    label: Background Opacity %
    type: select
    default: "100"
    options:
      "100": "100"
      "90": "90"
      "70": "70"
      "50": "50"
      "30": "30"
      "10": "10"
      "0": "0"
    width: 1/1
    help: Adjust the background opacity. Glass variants include backdrop blur.

  cta_line:
    type: line

  primary_cta_text:
    label: Primary Button Text
    type: text
    width: 1/2

  primary_cta_link:
    label: Primary Button Link
    type: url
    width: 1/2

  secondary_cta_text:
    label: Secondary Button Text
    type: text
    width: 1/2

  secondary_cta_link:
    label: Secondary Button Link
    type: url
    width: 1/2
