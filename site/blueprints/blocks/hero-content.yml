name: Hero Content
icon: star
preview: fields

fields:
  eyebrow:
    label: Eyebrow
    type: text
    help: Small text above the heading

  heading:
    label: Heading (H1)
    type: text
    help: The primary hero statement

  subheading:
    label: Subheading
    type: textarea
    buttons: false
    help: Supporting text below the heading

  alignment:
    label: Content Alignment
    type: select
    placeholder: Default
    options:
      left: Left Aligned
      center: Center Aligned
      right: Right Aligned
    width: 1/3

  theme:
    label: Block Theme
    type: select
    placeholder: Default
    options: query
    query:
      fetch: kirby.page("theme").color_profiles.toStructure
      text: "{{ item.profile_name }}"
      value: "{{ item.profile_id }}"
    width: 1/3

  backdrop_tint:
    label: Backdrop Tint (Glass Effect)
    type: select
    placeholder: Default
    options:
      transparent-light: Transparent (Light Text)
      transparent-dark: Transparent (Dark Text)
      glass-light-20: Light Glass (20%)
      glass-light-50: Light Glass (50%)
      glass-light-80: Light Glass (80%)
      glass-dark-20: Dark Glass (20%)
      glass-dark-50: Dark Glass (50%)
      glass-dark-80: Dark Glass (80%)
      solid-canvas: Solid Canvas
      solid-ink: Solid Ink
    width: 1/3
    help: Adds a background tint behind the text for legibility over media.

  # Primary CTA
  primary_cta_text:
    label: Primary Button Text
    type: text
    width: 1/2

  primary_cta_link:
    label: Primary Button Link
    type: text
    width: 1/2

  # Secondary CTA
  secondary_cta_text:
    label: Secondary Button Text
    type: text
    width: 1/2

  secondary_cta_link:
    label: Secondary Button Link
    type: text
    width: 1/2