name: Hero Content
icon: star
preview: fields

fields:
  eyebrow:
    label: Eyebrow
    type: text
    help: Small text above the heading

  heading:
    label: Heading (H1)
    type: text
    help: The primary hero statement

  subheading:
    label: Subheading
    type: textarea
    buttons: false
    help: Supporting text below the heading

  alignment:
    label: Content Alignment
    type: select
    empty: false
    options:
      "": Inherit Context (Left)
      center: Center Aligned
      right: Right Aligned
    default: ""
    width: 1/3

  theme:
    label: Block Theme
    type: select
    empty: false
    options:
      "": Inherit from Layout (Default)
      canvas: Canvas (Light)
      ink: Ink (Dark)
      oceanic: Oceanic Dark
      gold: Warm Gold
      soft-smoke: Soft Smoke
      brand-accent: Brand Accent
    default: ""
    width: 1/3

  backdrop_tint:
    label: Backdrop Tint (Glass Effect)
    type: select
    empty: false
    options:
      "": Inherit Context (Transparent)
      frost-light: Frost Light (Light Glass)
      frost-dark: Frost Dark (Dark Glass)
      solid-canvas: Solid Canvas
      solid-ink: Solid Ink
    default: ""
    width: 1/3
    help: Adds a background tint behind the text for legibility over media.

  # Primary CTA
  primary_cta_text:
    label: Primary Button Text
    type: text
    width: 1/2

  primary_cta_link:
    label: Primary Button Link
    type: text
    width: 1/2

  # Secondary CTA
  secondary_cta_text:
    label: Secondary Button Text
    type: text
    width: 1/2

  secondary_cta_link:
    label: Secondary Button Link
    type: text
    width: 1/2