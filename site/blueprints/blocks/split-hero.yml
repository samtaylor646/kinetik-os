name: Split Hero
icon: header
preview: fields
blueprint: block

fields:
  heading:
    label: Heading
    type: text
  
  subheading:
    label: Subheading
    type: textarea
    buttons: false
    
  image:
    label: Primary Image
    type: files
    max: 1
    layout: cards
    query: page.files.template('image')
    uploads: image

  background_video:
    label: Background Video (Optional)
    type: files
    max: 1
    layout: cards
    size: tiny
    help: If selected, this video will loop silently in the background instead of the theme color.
    query: page.files.template('video')
    uploads: video
    
  cta_text:
    label: CTA Button Text
    type: text
    
  cta_link:
    label: CTA Button Link
    type: url
    
  theme:
    label: Theme
    type: select
    options:
      light: Light (Canvas)
      oceanic: Oceanic Dark
      dark: Dark (Ink)
    default: light

  airy_spacing:
    label: Airy Spacing
    type: select
    options:
      sm: Small (sm)
      md: Medium (md)
      lg: Large (lg)
      xl: Extra Large (xl)
    default: md
