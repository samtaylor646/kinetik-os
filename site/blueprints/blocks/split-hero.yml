name: Split Hero
icon: header
preview: fields
blueprint: block

fields:
  heading:
    label: Heading
    type: text
  
  subheading:
    label: Subheading
    type: textarea
    buttons: false
    
  image:
    label: Primary Image
    type: files
    max: 1
    layout: cards
    query: page.files.template('image')
    uploads: image

  background_video:
    label: Background Video (Optional)
    type: files
    max: 1
    layout: cards
    size: tiny
    help: If selected, this video will loop silently in the background instead of the theme color.
    query: page.files.template('video')
    uploads: video

  video_fit:
    label: Video Fit
    type: select
    options:
      cover: Crop to Fill Section (Cover)
      contain: Fit inside Section (Contain)
    default: cover

  video_overlay_opacity:
    label: Video Tint / Overlay Opacity
    type: range
    min: 0
    max: 100
    step: 5
    default: 60
    help: "Set to 0 for no color tint (original video colors). Higher values mean stronger theme color overlay."
    
  cta_text:
    label: CTA Button Text
    type: text
    
  cta_link:
    label: CTA Button Link
    type: url
    
  background_width:
    label: Background Width
    type: select
    options:
      fluid: Full Width (Edge-to-Edge)
      contained: Contained (Aligned with Grid)
    default: fluid
    
  theme:
    label: Theme
    type: select
    options:
      light: Light (Canvas)
      oceanic: Oceanic Dark
      dark: Dark (Ink)
    default: oceanic

  airy_spacing:
    label: Airy Spacing
    type: select
    options:
      sm: Small (sm)
      md: Medium (md)
      lg: Large (lg)
      xl: Extra Large (xl)
    default: md
