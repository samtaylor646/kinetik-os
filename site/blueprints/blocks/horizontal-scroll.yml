name: Horizontal Scroll Carousel
icon: arrow-right-square
preview: fields

tabs:
  content:
    label: Content
    fields:
      panels:
        label: Carousel Panels
        type: blocks
        help: Add the blocks that will become horizontally scrolling panels.
  settings:
    label: Settings
    fields:
      theme:
        label: Section Theme
        type: select
        placeholder: Default / Inherit
        options: query
        query:
          fetch: kirby.page("theme").color_profiles.toStructure
          text: "{{ item.profile_name }}"
          value: "{{ item.profile_id }}"
        help: Select a background theme for the scroll section.