name: Tabbed Interface
icon: list-bullet

fields:
  tabs:
    type: structure
    label: Tabs
    fields:
      title:
        type: text
        label: Tab Title
      content:
        type: layout
        label: Tab Content
        layouts:
          - "1/1"
          - "1/2, 1/2"
          - "1/3, 2/3"
          - "2/3, 1/3"
          - "1/4, 3/4"
          - "3/4, 1/4"
          - "1/3, 1/3, 1/3"
          - "1/4, 1/4, 1/4, 1/4"
      icon:
        type: icon
        max: 1
        folder: "{{ kirby.root('base') }}/assets/icons"
        label: Lucide Icon Name
        help: Optional (e.g., arrow-right, check, etc.)
  vertical_align:
    label: Vertical Content Alignment
    type: select
    placeholder: Default (Top)
    options:
      top: Top
      center: Middle
      end: Bottom
    width: 1/2
  airy_spacing:
    type: select
    label: Airy Spacing
    default: md
    options:
      none: None
      sm: Small (sm)
      md: Medium (md)
      lg: Large (lg)
      xl: Extra Large (xl)
    width: 1/2

  theme:
    label: Block Theme
    type: select
    placeholder: Default / Inherit
    options: query
    query:
      fetch: kirby.page("theme").color_profiles.toStructure
      text: "{{ item.profile_name }}"
      value: "{{ item.profile_id }}"
    width: 1/1
