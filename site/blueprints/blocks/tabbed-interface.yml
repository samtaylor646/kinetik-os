name: Tabbed Interface
icon: list-bullet
preview: fields

fields:
  tabs:
    type: structure
    label: Tabs
    fields:
      title:
        type: text
        label: Tab Title
      content:
        type: textarea
        label: Tab Content
      icon:
        type: icon
        max: 1
        folder: "{{ kirby.root('base') }}/assets/icons"
        label: Lucide Icon Name
        help: Optional (e.g., arrow-right, check, etc.)
  airy_spacing:
    type: select
    label: Airy Spacing
    default: md
    options:
      sm: Small (sm)
      md: Medium (md)
      lg: Large (lg)
      xl: Extra Large (xl)

  theme:
    label: Block Theme
    type: select
    options:
      transparent: Inherit from Layout (Default)
      canvas: Canvas (Light)
      ink: Ink (Dark)
      oceanic: Oceanic Dark
      gold: Warm Gold
      soft-smoke: Soft Smoke
      brand-accent: Brand Accent
    default: transparent
    width: 1/1
