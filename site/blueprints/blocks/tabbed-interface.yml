name: Tabbed Interface
icon: list-bullet
preview: fields

fields:
  tabs:
    type: structure
    label: Tabs
    fields:
      title:
        type: text
        label: Tab Title
      content:
        type: textarea
        label: Tab Content
      icon:
        type: icon
        max: 1
        folder: "{{ kirby.root('base') }}/assets/icons"
        label: Lucide Icon Name
        help: Optional (e.g., arrow-right, check, etc.)
  airy_spacing:
    type: select
    label: Airy Spacing
    default: md
    options:
      none: None
      sm: Small (sm)
      md: Medium (md)
      lg: Large (lg)
      xl: Extra Large (xl)

  theme:
    label: Block Theme
    type: select
    placeholder: Default / Inherit
    options: query
    query:
      fetch: kirby.page("theme").color_profiles.toStructure
      text: "{{ item.profile_name }}"
      value: "{{ item.profile_id }}"
    width: 1/1