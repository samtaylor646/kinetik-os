name: Feature Card
icon: star
preview: fields
blueprint: block

fields:
  icon:
    label: Icon
    type: select
    options: query
    query:
      fetch: site.iconOptions
      text: "{{ arrayItem.text }}"
      value: "{{ arrayItem.value }}"
    width: 1/4
  title:
    label: Title
    type: text
    width: 3/4
  text:
    label: Description
    type: textarea
    buttons: false
