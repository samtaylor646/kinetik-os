name: Strategy Card
icon: box
preview: fields

fields:
  icon:
    label: Icon Name (Lucide)
    type: icon
    max: 1
    folder: "{{ kirby.root('base') }}/assets/icons"
    width: 1/2
    default: "check"
    
  title:
    label: Title
    type: text
    width: 1/2

  summary:
    label: Summary
    type: textarea
    buttons: false
    help: Short description always visible

  details:
    label: Full Details
    type: textarea
    help: Detailed text revealed on expand
    
  theme:
    label: Card Theme
    type: select
    placeholder: Default / Inherit
    options: query
    query:
      fetch: kirby.page("theme").color_profiles.toStructure
      text: "{{ item.profile_name }}"
      value: "{{ item.profile_id }}"