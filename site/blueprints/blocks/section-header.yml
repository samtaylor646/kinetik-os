name: Section Header
icon: text-left
preview: fields

fields:
  eyebrow:
    label: Eyebrow
    type: text
    help: Small text above the heading

  heading:
    label: Heading
    type: text

  subheading:
    label: Subheading
    type: textarea
    buttons: false

  alignment:
    label: Alignment
    type: select
    options:
      left: Left Aligned
      center: Center Aligned
    default: left

  theme:
    label: Theme
    type: select
    placeholder: Default / Inherit
    options: query
    query:
      fetch: kirby.page("theme").color_profiles.toStructure
      text: "{{ item.profile_name }}"
      value: "{{ item.profile_id }}"
  airy_spacing:
    label: Airy Spacing
    type: select
    options:
      sm: Small (sm)
      md: Medium (md)
      lg: Large (lg)
      xl: Extra Large (xl)
    default: sm
