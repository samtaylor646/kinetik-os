name: CTA Banner
icon: bell
preview: fields

fields:
  heading:
    type: text
    label: Heading
  text:
    type: textarea
    label: Text
    size: small
  buttons:
    type: structure
    label: Buttons
    fields:
      label:
        type: text
        label: Button Label
      url:
        type: text
        label: Button URL
      style:
        type: select
        label: Button Style
        default: primary
        options:
          primary: Primary
          secondary: Secondary
          ghost: Ghost
  theme:
    label: Theme
    type: select
    placeholder: Default / Inherit
    options: query
    query:
      fetch: kirby.page("theme").color_profiles.toStructure
      text: "{{ item.profile_name }}"
      value: "{{ item.profile_id }}"
  airy_spacing:
    type: select
    label: Airy Spacing
    default: md
    options:
      sm: Small (sm)
      md: Medium (md)
      lg: Large (lg)
      xl: Extra Large (xl)
