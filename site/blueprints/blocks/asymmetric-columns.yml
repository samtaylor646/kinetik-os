name: Sticky Asymmetric Columns
icon: columns
preview: fields

fields:
  heading:
    label: Sticky Heading
    type: text
    
  text:
    label: Sticky Text
    type: writer
    
  alignment:
    label: Sticky Column Alignment
    type: select
    options:
      left: Left Aligned
      right: Right Aligned
    default: left
    
  media_blocks:
    label: Scrolling Media Blocks
    type: blocks
    
  theme:
    label: Block Theme
    type: select
    placeholder: Default / Inherit
    options: query
    query:
      fetch: kirby.page("theme").color_profiles.toStructure
      text: "{{ item.profile_name }}"
      value: "{{ item.profile_id }}"
  airy_spacing:
    label: Airy Spacing
    type: select
    options:
      sm: Small (sm)
      md: Medium (md)
      lg: Large (lg)
      xl: Extra Large (xl)
    default: lg
