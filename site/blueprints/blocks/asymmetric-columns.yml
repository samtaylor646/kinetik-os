name: Sticky Asymmetric Columns
icon: columns
preview: fields

fields:
  heading:
    label: Sticky Heading
    type: text
    
  text:
    label: Sticky Text
    type: writer
    
  alignment:
    label: Sticky Column Alignment
    type: select
    options:
      left: Left Aligned
      right: Right Aligned
    default: left
    
  media_blocks:
    label: Scrolling Media Blocks
    type: blocks
    
  theme:
    label: Block Theme
    type: select
    options:
      light: Light (Canvas)
      oceanic: Oceanic Dark
      dark: Dark (Ink)
    default: light
    
  airy_spacing:
    label: Airy Spacing
    type: select
    options:
      sm: Small (sm)
      md: Medium (md)
      lg: Large (lg)
      xl: Extra Large (xl)
    default: lg
