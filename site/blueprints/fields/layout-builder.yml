settings:
  tabs:
    dimensions:
      label: Dimensions & Alignment
      icon: ruler
      fields:
        min_height:
          label: Minimum Height (Hero Setting)
          type: select
          options:
            auto: Auto (Content Height)
            vh-50: Half Screen (50vh)
            vh-75: Large (75vh)
            vh-100: Full Screen Hero (100vh)
          default: auto
          width: 1/2
          
        vertical_align:
          label: Vertical Content Alignment
          type: select
          options:
            start: Top
            center: Middle
            end: Bottom
          default: start
          width: 1/2

        row_padding:
          label: Row Padding (Y)
          type: select
          options:
            none: None
            sm: Small (Airy-SM)
            md: Medium (Airy-MD)
            lg: Large (Airy-LG)
            xl: Massive (Airy-XL)
          default: md
          width: 1/2

        row_width:
          label: Row Width Container
          type: select
          options:
            contained: Contained (Max-Width)
            full: Full Bleed
          default: contained
          width: 1/2

    background:
      label: Background Style
      icon: image
      fields:
        row_bg:
          label: Background Color / Theme
          type: select
          options:
            transparent: Transparent
            canvas: Canvas (Main Background)
            ink: Ink (Dark Text/Background)
            oceanic: Oceanic Dark
            gold: Warm Gold
            soft-smoke: Soft Smoke
            brand-accent: Brand Accent
          default: transparent
          width: 1/1

        background_media:
          label: Background Image or Video
          type: files
          multiple: false
          query: page.files.filterBy('type', 'in', ['image', 'video'])
          width: 1/2
          
        background_overlay:
          label: Image/Video Dark Overlay (%)
          type: range
          min: 0
          max: 100
          step: 5
          default: 0
          tooltip:
            before: Opacity
            after: "%"
          width: 1/2

    advanced:
      label: Advanced & Motion
      icon: bolt
      fields:
        gsap_reveal:
          label: GSAP Scroll Reveal
          type: toggle
          default: false
          width: 1/1

        custom_id:
          label: Custom ID (Anchor)
          type: text
          width: 1/2

        custom_class:
          label: Custom CSS Class
          type: text
          width: 1/2