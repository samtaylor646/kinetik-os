# Path: /site/blueprints/site.yml
# Filename: site.yml | Version: v7.8.0
# Agent: DX-Curator + Architect-K
# Status: Production
# Logic: Hybrid Global site blueprint (Starterkit + Motion Lab)

title: Site Settings

tabs:
  pages:
    label: Pages
    icon: text
    sections:
      drafts:
        headline: Drafts
        type: pages
        status: draft
        layout: list
        templates:
          - default
          - sandbox
      listed:
        headline: Main Pages
        type: pages
        status: listed
        layout: list
        templates:
          - default
          - sandbox
          - home
          - careers
      design_system:
        headline: Design System
        type: pages
        status: listed
        layout: list
        templates:
          - design-system
      unlisted:
        headline: Unlisted Pages
        type: pages
        status: unlisted
        layout: list
        templates:
          - default
          - sandbox
          - careers

  seo:
    label: SEO & Meta
    icon: search
    fields:
      title:
        type: text
        label: Site Title
      description:
        type: textarea
        label: SEO Description
        size: small
  
  motion:
    label: Motion Lab
    icon: bolt
    fields:
      kinetik_duration:
        type: text
        label: Animation Duration
        default: "1.2s"
        help: Default duration for GSAP animations
      
      kinetik_ease:
        type: select
        label: Animation Easing
        default: power3.out
        options:
          power1.out: Power1
          power2.out: Power2
          power3.out: Power3
          power4.out: Power4
          elastic.out: Elastic
      
      kinetik_parallax_speed:
        type: number
        label: Parallax Speed
        default: 0.5
        min: 0
        max: 1
        step: 0.1
